<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Interactive Map of Harare - Web-GIS</title>

        <!-- qgis2web & OpenLayers CSS -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">

        <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
        }

        /* Navigation Menu Styling */
        .topnav {
            background-color: #2c7da0;
            overflow: hidden;
            position: fixed;
            top: 0;
            width: 100%;
            height: 48px;
            z-index: 1000;
        }

        .topnav a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 15px;
            line-height: 20px;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        .topnav a.active {
            background-color: #1e6f3f;
            color: white;
        }

        /* Map Container (Positioned between Header and Footer) */
        #map {
            position: absolute;
            top: 48px;
            bottom: 32px;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
        }

        /* OpenLayers General Control Overrides */
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* OpenLayers Custom Home Control Button */
        .ol-home-control {
            top: 65px;
            left: .5em;
        }
        .ol-home-control button {
            background-color: #ffffff !important;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        /* Footer Styling */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 32px;
            background-color: #333;
            color: white;
            text-align: center;
            line-height: 32px;
            font-size: 12px;
            z-index: 1000;
        }
        footer p {
            margin: 0;
        }
        </style>
    </head>
    <body>

        <!-- Navigation Menu -->
        <div class="topnav">
            <a class="active" href="#">Home</a>
            <a href="#">Infrastructure Map</a>
            <a href="#">Data Sources</a>
            <a href="#">Contact</a>
        </div>

        <!-- OpenLayers Map Container -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2025 Geospatial Intelligence Unit | Zimbabwe Infrastructure Mapping Project</p>
        </footer>

        <!-- Core qgis2web & OpenLayers Scripts -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/provinces_2.js"></script>
        <script src="layers/districts_3.js"></script>
        <script src="layers/landuse_4.js"></script>
        <script src="layers/cities_5.js"></script>
        <script src="layers/health_centre_6.js"></script>
        <script src="layers/roads_7.js"></script>
        <script src="layers/roads_cut_8.js"></script>
        <script src="layers/towns_9.js"></script>
        <script src="layers/secondary_schools_10.js"></script>
        <script src="styles/provinces_2_style.js"></script>
        <script src="styles/districts_3_style.js"></script>
        <script src="styles/landuse_4_style.js"></script>
        <script src="styles/cities_5_style.js"></script>
        <script src="styles/health_centre_6_style.js"></script>
        <script src="styles/roads_7_style.js"></script>
        <script src="styles/roads_cut_8_style.js"></script>
        <script src="styles/towns_9_style.js"></script>
        <script src="styles/secondary_schools_10_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        

        <!-- Custom OpenLayers Home Control Injection -->
        <script>
            (function() {
                // Define OpenLayers Home Button Control
                window.HomeControl = function(opt_options) {
                    var options = opt_options || {};
                    var button = document.createElement('button');
                    button.innerHTML = '🏠';
                    button.title = 'Return to Harare';

                    var element = document.createElement('div');
                    element.className = 'ol-home-control ol-unselectable ol-control';
                    element.appendChild(button);

                    button.addEventListener('click', function() {
                        // Transforms EPSG:4326 (Lat/Lon) to EPSG:3857 (OpenLayers Default Projection)
                        var harareCoords = ol.proj.fromLonLat([31.0335, -17.8252]);
                        map.getView().animate({
                            center: harareCoords,
                            zoom: 13,
                            duration: 800
                        });
                    }, false);

                    ol.control.Control.call(this, {
                        element: element,
                        target: options.target
                    });
                };
                ol.inherits(window.HomeControl, ol.control.Control);

                // Add control once OpenLayers map instance is initialized
                if (typeof map !== 'undefined') {
                    map.addControl(new window.HomeControl());
                } else {
                    document.addEventListener("DOMContentLoaded", function() {
                        if (typeof map !== 'undefined') {
                            map.addControl(new window.HomeControl());
                        }
                    });
                }
            })();
        </script>
    </body>
</html>
